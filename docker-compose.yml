services:
  # Default CPU-friendly Remotion + Three.js renderer (SwANGLE)
  remotion:
    build: .
    image: faceless-video-v2:latest
    ports:
      - "3000:3000"
    shm_size: "2gb"
    environment:
      - REMOTION_TMP=/tmp/remotion
      - REMOTION_GL=swangle
      - NODE_OPTIONS=--max-old-space-size=6144
    volumes:
      - .:/app
      - /app/node_modules
      - ./out:/app/out
      - ./build:/app/build
      - remotion_tmp:/tmp/remotion
    working_dir: /app

  # Hardware-accelerated NVIDIA GPU renderer (5-10x faster for .glb shadows + crowds)
  # Run with: docker compose --profile gpu run --rm remotion-gpu npx remotion render ...
  remotion-gpu:
    profiles: ["gpu"]
    build: .
    image: faceless-video-v2:latest
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - REMOTION_TMP=/tmp/remotion
      - REMOTION_GL=angle
      - NODE_OPTIONS=--max-old-space-size=6144
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
    volumes:
      - .:/app
      - /app/node_modules
      - ./out:/app/out
      - ./build:/app/build
      - remotion_tmp:/tmp/remotion
    working_dir: /app

volumes:
  remotion_tmp:
